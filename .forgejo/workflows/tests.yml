name: CI

# Forge CI (usb-ci FR-10.2): the tier-1 suites on every push and PR. The
# release path stays on GitHub (FR-10.4) -- see .github/workflows/release.yml,
# which still gates on the full windows/mac/linux matrix that this runner
# cannot provide (FR-10.17: macos-latest and windows-latest do not exist
# self-hosted, and macOS has no substitute).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # The general runner (usb-ci TS 6.2), label `linux`.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT DeLaGuardo/setup-clojure: it authenticates to api.github.com with
        # the job's GITHUB_TOKEN -- a Forgejo token here -- and 401s, even for a
        # pinned version, because it sends the header on the release-asset
        # download too (usb-ci docs/migration.md). The official installer
        # involves no GitHub at all.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh

      - name: Run unit tests
        run: clojure -M:test

  integration:
    runs-on: linux

    # Forge jobs hold no docker socket (usb-ci #22/NFR-5), so the SMB fixture's
    # Testcontainers path cannot run here. Two samba sidecars stand in, and the
    # fixture takes them from the environment instead of starting anything --
    # the same injection seam pigeon-scoops-backend uses for Postgres.
    #
    # TWO servers, not one, because the fixture reaches the guest and
    # authenticated shares through DIFFERENT host strings: dapr.device.smb.fs
    # caches one FileSystem per host, and a single hostname would collapse the
    # anonymous and authenticated connections into one cache entry. Each
    # declares BOTH shares, so share enumeration against the guest host still
    # sees Music and Private.
    #
    # Pinned by digest, not by a tag: :latest tags get cached and silently go
    # stale (usb-ci #57). This digest is smbd-only-latest as verified on
    # 2026-08-17 -- guest read/write, authenticated read/write, and anonymous
    # access to Private correctly refused.
    env:
      TEST_SMB_GUEST_URL: smb://samba-guest/Music/
      TEST_SMB_AUTH_URL: smb://samba-auth/Private/

    # Written out twice rather than shared with a YAML anchor: Forgejo's parser
    # expands anchors but GitHub Actions rejects them, and workflow files in this
    # repo get copied between the two.
    #
    # `root preexec` creates the share directory: this image ships none and
    # expects a volume, and a share whose path is missing fails every tree
    # connect with NT_STATUS_BAD_NETWORK_NAME. Doing it here keeps the sidecars
    # configurable by environment alone -- services: has no command field, and
    # act_runner may refuse volume mounts.
    services:
      samba-guest:
        image: ghcr.io/servercontainers/samba@sha256:a789aa42c2e5db804fab5fb5dd5f2d4343a9a8a7789e4a191aab45e993c15d4f
        env:
          ACCOUNT_dapr: Secretpass1!
          UID_dapr: "1000"
          SAMBA_VOLUME_CONFIG_music: "[Music]; path=/shares/music; guest ok = yes; read only = no; browseable = yes; force user = root; root preexec = mkdir -p /shares/music"
          SAMBA_VOLUME_CONFIG_private: "[Private]; path=/shares/private; valid users = dapr; guest ok = no; read only = no; browseable = yes; force user = root; root preexec = mkdir -p /shares/private"
      samba-auth:
        image: ghcr.io/servercontainers/samba@sha256:a789aa42c2e5db804fab5fb5dd5f2d4343a9a8a7789e4a191aab45e993c15d4f
        env:
          ACCOUNT_dapr: Secretpass1!
          UID_dapr: "1000"
          SAMBA_VOLUME_CONFIG_music: "[Music]; path=/shares/music; guest ok = yes; read only = no; browseable = yes; force user = root; root preexec = mkdir -p /shares/music"
          SAMBA_VOLUME_CONFIG_private: "[Private]; path=/shares/private; valid users = dapr; guest ok = no; read only = no; browseable = yes; force user = root; root preexec = mkdir -p /shares/private"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh

      - name: Run integration tests
        # MTP skips without a device attached; SMB runs against the sidecars.
        run: clojure -M:integration
