name: CI

# Forge CI (usb-ci FR-10.2): the tier-1 suites on every push and PR.
#
# The OS split follows FR-10.17 literally: windows-latest does not exist here
# but Windows does, so both Windows legs are RELABELLED (runs-on: windows)
# rather than dropped. The native Apple-silicon runner now supplies the macOS
# jobs below on pull requests and pushes to main, so a macOS regression
# surfaces before merge rather than at tag time.
#
# .github/workflows/release.yml consumes the exact-SHA status posted below, so
# the integration results from Linux, Windows, and macOS gate releases without
# repeating the integration matrix on GitHub.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# One device, so one run of this workflow at a time. cancel-in-progress stays
# false: superseded PENDING runs die before touching hardware (the safe half of
# auto-cancel, usb-ci FR-4.8), but cancelling in flight can orphan the lease
# until its TTL expires even though release is if: always(). The cost is that
# lint/test queue behind a device run too -- acceptable at this repo's traffic,
# and the alternative is a second workflow file duplicating the triggers.
concurrency:
  group: dapr-device-tests
  cancel-in-progress: false

jobs:
  test:
    # The general runner (usb-ci TS 6.2), label `linux`.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT DeLaGuardo/setup-clojure: it authenticates to api.github.com with
        # the job's GITHUB_TOKEN -- a Forgejo token here -- and 401s, even for a
        # pinned version, because it sends the header on the release-asset
        # download too (usb-ci docs/migration.md). The official installer
        # involves no GitHub at all.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh

      - name: Run unit tests
        run: clojure -M:test

  test-windows:
    # The bare platform label, NOT windows-usb: windows-usb selects the device
    # executor for jobs that need the USB controller (FR-4.2, FR-9.9). This is
    # an ordinary build, and win-runner is registered as both -- "general
    # Windows builder + device executor" (FR-4.9).
    #
    # That runner is host mode, CAPACITY 1, so this job and a device job cannot
    # overlap: whichever starts first makes the other wait. Unit tests are
    # minutes and dapr's PR traffic is low, so the contention is bounded -- but
    # if device runs start queueing behind CI, this is the job to move to a tag
    # or a nightly rather than every PR.
    #
    # Host mode also means no containers: JS actions run on the guest's own
    # node, installed once per usb-ci docs/device-runners.md.
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # NOT win-install.ps1, and NOT setup-clojure. The official Windows
        # installer is INTERACTIVE -- it lists the PSModulePath entries and
        # calls Read-Host for a choice -- so in a runner it fails outright.
        # setup-clojure is the other trap: it authenticates to api.github.com
        # with the job's GITHUB_TOKEN, a Forgejo token here, and 401s.
        #
        # So install the module the installer would have installed: the same
        # clojure-tools.zip, expanded into a user module path. Anonymous
        # download, no prompt, and no admin -- which matters because the runner
        # service runs as the non-admin ci-runner (usb-ci TS 6.1). Later pwsh
        # steps auto-load it because the destination is on PSModulePath.
        shell: pwsh
        run: |
          $ver = '1.12.4.1618'
          Invoke-WebRequest "https://github.com/clojure/brew-install/releases/download/$ver/clojure-tools.zip" -OutFile clojure-tools.zip
          $dest = Join-Path $HOME 'Documents\PowerShell\Modules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive clojure-tools.zip -DestinationPath $dest -Force
          Remove-Item clojure-tools.zip
          Import-Module ClojureTools
          clojure -Sdescribe

      - name: Run unit tests
        shell: pwsh
        run: clojure -M:test

  test-macos:
    # Native Apple-silicon host runner, capacity 1. Homebrew and Clojure are
    # machine prerequisites provisioned once on the persistent runner.
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the provisioned Clojure CLI
        run: clojure -Sdescribe

      - name: Run unit tests
        run: clojure -M:test

  # Browser end-to-end tests (e2e/, see its README). They start the app
  # themselves and drive it in Chromium, which is the only way to exercise the
  # parts of the UI that are not Clojure: that htmx is wired up, that a pushed
  # notification actually makes a region re-fetch itself (dapr.web.events), and
  # that a sync started from the page puts real files on disk.
  #
  # The general `linux` runner is DOCKERIZED -- unlike linux-usb/windows/
  # windows-usb, which are VMs. So this job is root in a container of its own,
  # rather than depending on a bring-up step the way the device jobs below
  # depend on their SMB shares: a fresh container would not have kept one
  # anyway. It also means the port the app binds (7374) is namespaced to this
  # job, so it cannot collide with anything else.
  #
  # What it does NOT do any more is install Chromium's system libraries per
  # run. `--with-deps` was 1m48s of a 2m4s step on run 152 -- 70 packages and
  # 241 MB unpacked onto a throwaway overlay, while the browser itself was 14s
  # -- so the job runs in Playwright's own image, which ships both. The tag
  # MUST track @playwright/test in e2e/package-lock.json; the install step
  # below re-downloads a mismatched browser rather than failing, so drift shows
  # up as the cost coming back, not as a red job.
  #
  # This lives here rather than in a workflow of its own for the reason the file
  # header gives: a second file would duplicate the triggers.
  e2e:
    runs-on: linux
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # See the test job: the official installer, never setup-clojure.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh

      - name: Set up Node
        # If this ever 401s the way setup-clojure did, it is resolving versions
        # through api.github.com with the Forgejo token -- replace it with a
        # direct download from nodejs.org rather than debugging the token.
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        # No --with-deps: the container this job runs in ships those libraries,
        # which is the whole point of pinning it. This step stays anyway, and
        # costs seconds when the image already has the right browser at
        # PLAYWRIGHT_BROWSERS_PATH -- it is what turns a tag that has drifted
        # from package-lock.json into a slow run rather than a broken one.
        run: npx playwright install chromium

      - name: Run the browser tests
        working-directory: e2e
        run: npm test

      - name: Keep the report and traces of a failure
        if: failure()
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # The macOS integration job has no device yet, so its MTP tests skip. SMB runs
  # against the persistent loopback-only Samba service. The two jobs below run
  # the same suite with the real MTP device attached.
  integration-macos:
    runs-on: macos
    env:
      TEST_SMB_GUEST_URL: smb://127.0.0.1/Music/
      TEST_SMB_AUTH_URL: smb://localhost/Private/
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the provisioned Clojure CLI
        run: clojure -Sdescribe

      - name: Check the persistent native SMB shares
        shell: bash
        run: |
          set -euo pipefail
          listing="$(/opt/homebrew/opt/samba/bin/smbclient \
            -L //127.0.0.1 -U 'dapr%Secretpass1!')"
          for share in Music Private; do
            grep -qw "$share" <<<"$listing" || {
              echo "SMB share '$share' is missing; provision the macOS runner's persistent Samba service" >&2
              exit 1
            }
          done
          echo "Music and Private shares present"

      # DAPR_REQUIRE_DEVICE stays unset until the physical USB switch makes a
      # macos-usb runner possible, so only the MTP tests skip.
      - name: Run integration tests
        run: clojure -M:integration

  # Both device integration jobs run on the DEVICE runners (FR-4.2,
  # FR-9.9/9.10):
  # linux-usb/windows-usb select the executor that can receive the USB
  # controller, and device-mtp is the capability label, because these tests
  # exercise whatever MTP device is attached. The same label goes to
  # --device-label: one vocabulary for dispatch and acquire.
  #
  # DAPR_REQUIRE_DEVICE turns a device-absent skip into a failure. Without it a
  # job could acquire the lock, hot-plug the controller, skip every MTP test and
  # report success -- "Ran 5 tests containing 0 assertions" is green while
  # proving nothing.
  integration:
    runs-on: [linux-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
      DAPR_REQUIRE_DEVICE: "1"
      # No sidecars: host mode has no service containers. SMB comes from the
      # guest's own samba, provisioned once at bring-up (usb-ci
      # docs/device-runners.md) exactly as win-runner's shares are. Setting
      # these also stops the fixture reaching for Testcontainers, which cannot
      # work without a docker socket.
      TEST_SMB_GUEST_URL: smb://127.0.0.1/Music/
      TEST_SMB_AUTH_URL: smb://localhost/Private/
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # --prefix into the job's own HOME: host mode means the runner user is
        # not root, and a job must not sudo or apt-get inside a VM it shares
        # with every other job.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Check the native SMB shares are provisioned
        run: |
          command -v smbclient >/dev/null || { echo "smbclient missing; provision this runner per usb-ci docs/device-runners.md" >&2; exit 1; }
          for share in Music Private; do
            smbclient -L //127.0.0.1 -N 2>/dev/null | grep -qw "$share" \
              || { echo "SMB share '$share' is missing. Provision this runner per usb-ci docs/device-runners.md (.forgejo/scripts/smb-setup-linux.sh, as root, once)." >&2; exit 1; }
          done
          echo "Music and Private shares present"

      # TS 6.1 step 0: the service serves its own client, so this job always
      # runs the client that matches the deployed service. No copy lives in
      # this repo, deliberately -- copies drift with the service API.
      - name: Fetch the lock client
        run: curl -fsS "$LOCKSERVICE_URL/client/devicelock.py" -o devicelock.py

      # python3, not python: Ubuntu ships no `python` alias (recorded scar from
      # the GitHub-runner era of usb-ci's device-tests.yml).
      - name: Acquire device lock
        run: python3 devicelock.py acquire --target linux --device-label device-mtp

      # FR-9.8: confirm the guest actually enumerates the vendor:product the
      # catalog declares for the attached type -- the only check that catches a
      # hardware swap nobody re-declared.
      - name: Verify the attached device
        run: python3 devicelock.py verify

      - name: Run integration tests
        run: clojure -M:integration

      - name: Release device lock
        if: always()
        run: python3 devicelock.py release

  integration-windows:
    runs-on: [windows-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
      DAPR_REQUIRE_DEVICE: "1"
    # No sidecars and no TEST_SMB_* here: host mode has no service containers,
    # and the fixture's non-Linux path already targets the guest's native SMB
    # server at 127.0.0.1/localhost, authenticating as dapr. Those shares are
    # provisioned once at bring-up (usb-ci docs/device-runners.md), because
    # smb-setup-windows.ps1 needs admin and the runner service deliberately
    # runs as the non-admin ci-runner.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        shell: pwsh
        run: |
          $ver = '1.12.4.1618'
          Invoke-WebRequest "https://github.com/clojure/brew-install/releases/download/$ver/clojure-tools.zip" -OutFile clojure-tools.zip
          $dest = Join-Path $HOME 'Documents\PowerShell\Modules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive clojure-tools.zip -DestinationPath $dest -Force
          Remove-Item clojure-tools.zip
          Import-Module ClojureTools
          clojure -Sdescribe

      - name: Check the native SMB shares are provisioned
        shell: pwsh
        run: |
          foreach ($s in 'Music','Private') {
            if (-not (Get-SmbShare -Name $s -ErrorAction SilentlyContinue)) {
              throw "SMB share '$s' is missing. Provision this runner per usb-ci docs/device-runners.md (smb-setup-windows.ps1, as admin, once)."
            }
          }
          Write-Host 'Music and Private shares present'

      - name: Fetch the lock client
        shell: pwsh
        run: Invoke-WebRequest "$env:LOCKSERVICE_URL/client/devicelock.py" -OutFile devicelock.py

      - name: Acquire device lock
        shell: pwsh
        run: python devicelock.py acquire --target windows --device-label device-mtp

      - name: Verify the attached device
        shell: pwsh
        run: python devicelock.py verify

      - name: Run integration tests
        shell: pwsh
        run: clojure -M:integration

      - name: Release device lock
        if: always()
        shell: pwsh
        run: python devicelock.py release

  # The release gate's forge half (usb-ci FR-10.9-10.12, TS 6.3): publish the
  # combined integration outcome to the GitHub mirror as a commit status for
  # this SHA, which release.yml over there requires before publishing. Push runs only -- PR-branch
  # SHAs need not exist on the mirror, and releases tag main commits. Runs on the
  # general runner: it needs api.github.com, not hardware. Fail closed cuts both
  # ways (FR-10.10): a status that cannot be posted fails THIS job loudly, because
  # a status that silently never lands is a release that silently never unblocks.
  report:
    if: always() && github.event_name == 'push'
    needs: [integration, integration-windows, integration-macos]
    runs-on: linux
    env:
      WINDOWS_RESULT: ${{ needs['integration-windows'].result }}
      LINUX_RESULT: ${{ needs.integration.result }}
      MACOS_RESULT: ${{ needs['integration-macos'].result }}
      STATUS_TOKEN: ${{ secrets.MIRROR_STATUS_TOKEN }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
    steps:
      - name: Post the integration outcome to the GitHub mirror
        run: |
          set -euo pipefail
          if [ -z "$STATUS_TOKEN" ]; then
            echo "MIRROR_STATUS_TOKEN is not set; cannot post the hardware status." >&2
            echo "Releases stay blocked until it is (FR-10.10, fail closed)." >&2
            exit 1
          fi
          state=failure
          [ "$WINDOWS_RESULT" = success ] \
            && [ "$LINUX_RESULT" = success ] \
            && [ "$MACOS_RESULT" = success ] \
            && state=success
          # The mirror syncs on commit, but this post can still race the SHA's
          # arrival on GitHub (TS 6.3) -- retry, don't fail on the first
          # "No commit found".
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $STATUS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"forge/device-tests\",\"description\":\"windows: $WINDOWS_RESULT, linux: $LINUX_RESULT, macos: $MACOS_RESULT\",\"target_url\":\"$TARGET_URL\"}")
            if [ "$code" = 201 ]; then
              echo "posted $state for $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $attempt/10: HTTP $code"
            cat resp.json || true
            sleep 15
          done
          echo "never posted the status; the release gate stays closed (FR-10.10)" >&2
          exit 1
