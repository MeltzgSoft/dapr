name: Device Tests

# Tier 2 (usb-ci FR-4.5): the MTP integration tests against the real device, on
# the device runners inside the VMs. pull_request is safe here in a way it was
# not on GitHub: the forge is single-user with registration closed (NFR-4), so
# there are no fork PRs and a PR can only run operator-authored code -- and
# FR-4.4 wants hardware tests on PRs, since catching a regression before merge
# is the reason the lab exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# One device, so one run at a time. cancel-in-progress stays false: superseded
# PENDING runs die before touching hardware (the safe half of auto-cancel,
# FR-4.8), but cancelling in flight can orphan the lease until its TTL expires
# even though release is if: always().
concurrency:
  group: device-tests
  cancel-in-progress: false

# Only the MTP namespaces, never the whole :integration alias. The device
# runners are host mode, so they have no service containers -- the samba
# sidecars the SMB tests use on the general runner do not exist here, and
# linux-runner has no native SMB server either. tests.yml already covers SMB.
env:
  MTP_NAMESPACES: >-
    -n dapr.device.mtp.fs-integration-test
    -n dapr.device.mtp.tag-integration-test
  # Turns a device-absent skip into a failure. Without it a job could acquire
  # the lock, hot-plug the controller, skip every test and report success --
  # green while proving nothing.
  DAPR_REQUIRE_DEVICE: "1"

jobs:
  # runs-on vocabulary (FR-4.2, FR-9.9/9.10): windows-usb/linux-usb select the
  # executor that can receive the controller -- never the bare platform label --
  # and device-mtp is the capability label, because these tests exercise
  # whatever MTP device is attached. The SAME label goes to --device-label: one
  # vocabulary for dispatch and acquire.
  windows:
    runs-on: [windows-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # See tests.yml: the official Windows installer is interactive, so
        # install the module it would have installed. No admin needed.
        shell: pwsh
        run: |
          $ver = '1.12.4.1618'
          Invoke-WebRequest "https://github.com/clojure/brew-install/releases/download/$ver/clojure-tools.zip" -OutFile clojure-tools.zip
          $dest = Join-Path $HOME 'Documents\PowerShell\Modules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive clojure-tools.zip -DestinationPath $dest -Force
          Remove-Item clojure-tools.zip
          Import-Module ClojureTools
          clojure -Sdescribe

      # TS 6.1 step 0: the service serves its own client, so this job always
      # runs the client that matches the deployed service. No copy lives in
      # this repo, deliberately -- copies drift with the service API.
      - name: Fetch the lock client
        shell: pwsh
        run: Invoke-WebRequest "$env:LOCKSERVICE_URL/client/devicelock.py" -OutFile devicelock.py

      - name: Acquire device lock
        shell: pwsh
        run: python devicelock.py acquire --target windows --device-label device-mtp

      # FR-9.8: confirm the guest actually enumerates the vendor:product the
      # catalog declares for the attached type -- the only check that catches a
      # hardware swap nobody re-declared.
      - name: Verify the attached device
        shell: pwsh
        run: python devicelock.py verify

      - name: Run MTP integration tests
        shell: pwsh
        run: clojure -M:integration ${{ env.MTP_NAMESPACES }}

      - name: Release device lock
        if: always()
        shell: pwsh
        run: python devicelock.py release

  linux:
    runs-on: [linux-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install Clojure CLI
        # --prefix into the job's own HOME: host mode means the runner user is
        # not root and a job must not sudo or apt-get inside a VM it shares
        # with every other job. libmtp9 and usbutils are the guest image's
        # responsibility, installed once at bring-up.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh --prefix "$HOME/clojure"
          echo "$HOME/clojure/bin" >> "$GITHUB_PATH"

      - name: Fetch the lock client
        run: curl -fsS "$LOCKSERVICE_URL/client/devicelock.py" -o devicelock.py

      # python3, not python: Ubuntu ships no `python` alias (recorded scar from
      # the GitHub-runner era of usb-ci's device-tests.yml).
      - name: Acquire device lock
        run: python3 devicelock.py acquire --target linux --device-label device-mtp

      - name: Verify the attached device
        run: python3 devicelock.py verify

      - name: Run MTP integration tests
        run: clojure -M:integration ${{ env.MTP_NAMESPACES }}

      - name: Release device lock
        if: always()
        run: python3 devicelock.py release
