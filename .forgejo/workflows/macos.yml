name: macOS

# Tier-1 macOS coverage on the native Apple-silicon Forgejo runner. The
# persistent runner is host mode and capacity 1, so these jobs serialize even
# though Forgejo dispatches them together. Homebrew, Clojure and the loopback-
# only Samba shares are machine prerequisites provisioned once on the runner.
#
# Release tags still run the full GitHub-hosted matrix from release.yml. This
# workflow replaces only the old GitHub push-to-main wrapper, so a regression
# still surfaces on the commit that reached main rather than at tag time.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the provisioned Clojure CLI
        run: clojure -Sdescribe

      - name: Run unit tests
        run: clojure -M:test

  integration:
    runs-on: macos
    env:
      # No Docker on this host runner. Both names resolve to the persistent
      # loopback-only Samba service, matching the native GitHub-macOS shape.
      TEST_SMB_GUEST_URL: smb://127.0.0.1/Music/
      TEST_SMB_AUTH_URL: smb://localhost/Private/
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the persistent native SMB shares
        shell: bash
        run: |
          set -euo pipefail
          listing="$(/opt/homebrew/opt/samba/bin/smbclient \
            -L //127.0.0.1 -U 'dapr%Secretpass1!')"
          for share in Music Private; do
            grep -qw "$share" <<<"$listing" || {
              echo "SMB share '$share' is missing; provision the macOS runner's persistent Samba service" >&2
              exit 1
            }
          done
          echo "Music and Private shares present"

      - name: Check the provisioned Clojure CLI
        run: clojure -Sdescribe

      # DAPR_REQUIRE_DEVICE stays unset: this is tier 1, so MTP tests skip
      # until the physical USB switch makes a macos-usb runner possible.
      - name: Run integration tests
        run: clojure -M:integration
