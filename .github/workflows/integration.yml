name: Integration

# Integration tests against live external services (clojure -M:integration).
#
# The SMB tests need a live SMB server, provisioned differently per OS because the
# GitHub runners differ:
#   - Linux:   the test's :once fixture starts a dperson/samba Testcontainer
#              (Docker is present on ubuntu-latest), so no setup step is needed.
#   - macOS /  those runners can't run the Linux Samba image (no Docker on macOS;
#     Windows: Windows runs only Windows containers), so a setup step below stands
#              up the host's native SMB server with the same shares instead.
# The MTP tests run only when a real device is attached, so they skip in CI.

# Everyday CI runs on the forge now (usb-ci FR-10.2, .forgejo/workflows/), where
# the Linux SMB leg uses samba sidecars instead of Testcontainers -- forge jobs
# hold no docker socket (usb-ci #22/NFR-5).
#
# The Windows leg moved too, and uses the guest's NATIVE SMB server there --
# win-runner is host mode, so it has no service containers, which makes it the
# same shape as the Windows job below. The difference is only who provisions
# the shares: a throwaway GitHub runner runs smb-setup-windows.ps1 per job,
# while the forge guest is provisioned once as admin (usb-ci
# docs/device-runners.md), because its runner service is deliberately non-admin
# and its machine state persists between jobs.
#
# So this file stays on GitHub purely as release.yml's gate. Everyday macOS
# coverage now runs on the native Forgejo runner from
# .forgejo/workflows/macos.yml, rather than leaving macOS unproven until a tag
# is cut.
# The pull_request and push triggers are gone deliberately (FR-2.7): mirror
# pushes fire GitHub workflows, so leaving them would re-run this whole matrix
# on every sync.
on:
  # Callable from release.yml -- see the note in test.yml on FR-10.16/FR-10.17.
  workflow_call:
    inputs:
      os-list:
        description: >-
          JSON array of runner labels to test on. release.yml takes the default
          full matrix; callers may narrow it for a targeted gate or smoke run.
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ matrix.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ matrix.os }}-

      # Linux uses a Testcontainer from the fixture; macOS/Windows need the host's
      # native SMB server provisioned with the Music (guest) and Private shares.
      - name: Provision native SMB server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/smb-setup-macos.sh

      - name: Provision native SMB server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/smb-setup-windows.ps1

      - name: Run integration tests
        run: clojure -M:integration

      # Diagnostic: surface the macOS Samba log if the integration step failed.
      - name: Dump macOS Samba log
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: cat "$RUNNER_TEMP"/smb/log.* 2>/dev/null || echo "(no Samba log)"
