name: Release

# On a v#.#.# tag, run the unit + integration suites (the same reusable
# workflows, and hence the same windows/mac/linux matrix, as CI) and -- only if
# both pass -- publish two kinds of artifact to a GitHub release:
#
#   dapr-<version>.jar   one jar, every OS. The UI is a local web app, so
#                        nothing on the classpath ships per-platform natives
#                        (the MTP and keystore backends bind to whatever the host
#                        provides at runtime). This is the artifact for anyone
#                        who already has a JDK.
#
#   Dapr-<version>.*     desktop installers, one build per OS. These ARE
#                        per-platform -- an installer is a platform artifact by
#                        definition -- and each carries its own trimmed JRE
#                        (jlink; see build.clj's stage-electron) so someone who
#                        has never installed Java can still run Dapr.
#
# So the per-OS matrix below is not a return to the JavaFX situation that was
# removed: the *jar* is still universal. What is per-OS is the installer wrapped
# around it and the runtime inside that installer.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # The gate override (usb-ci FR-10.12): with the lab down, dispatch this
  # workflow from the tag's ref with override_hardware_gate=true and a reason.
  # The dispatch inputs in the run log are the trace -- bypassing must be
  # deliberate and recorded, never "disable the check and forget".
  workflow_dispatch:
    inputs:
      override_hardware_gate:
        description: "Skip the forge/device-tests status gate (lab outage only)"
        type: boolean
        default: false
      reason:
        description: "Why the gate is being overridden (recorded in this run's log)"
        required: false
        default: ""
      # Smoke test for the packaging matrix. The installer legs only ever run on
      # a tag, so without this the first time Windows and macOS package anything
      # is during a real release -- and a failure there is a release that got its
      # jar attached and its installers not. This builds them from any ref, with
      # no gates and nothing published: the artifacts land on the run for you to
      # download and open.
      installers_only:
        description: "Build the installers only: no gates, no release, artifacts on the run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The release gate's GitHub half (usb-ci FR-10.8-10.12). The forge runs the
  # real-device integration tests and posts the outcome for each main SHA as the
  # commit status `forge/device-tests` (tests.yml's report job). No status, or a
  # failed one, blocks the release -- fail closed (FR-10.10), keyed to the exact
  # commit being released (FR-10.11), never to recency.
  #
  # Outbound-only by design (FR-10.9): GitHub-hosted runners cannot reach the
  # forge behind the home network, so the forge pushes the result here rather
  # than this job pulling it.
  hardware-gate:
    # A smoke build publishes nothing, so there is nothing for the gate to
    # protect. Skipped rather than overridden: the override is a recorded
    # decision about a real release, and reusing it here would blur that.
    if: ${{ !inputs.installers_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      # workflow_dispatch can be pointed at any ref, and everything downstream
      # assumes a v#.#.# tag: DAPR_VERSION is ${{ github.ref_name }}, so a
      # dispatch from main would build dapr-main-*.jar and publish a GitHub
      # Release tagged "main". Checked BEFORE the override, because the override
      # exists to skip a missing hardware result during a lab outage -- never to
      # release from a branch.
      - name: Require a semantic-version tag ref
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::run this from a v#.#.# tag ref, not '$GITHUB_REF_NAME'"; exit 1; }

      - name: Require the forge/device-tests status on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.override_hardware_gate }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "${OVERRIDE:-false}" = "true" ]; then
            echo "::warning::hardware gate OVERRIDDEN (FR-10.12). Reason: ${REASON:-none given}"
            exit 0
          fi
          # Resolve the tag to its commit through the API rather than trusting
          # GITHUB_SHA: for annotated tags GITHUB_SHA can be the tag object, and
          # statuses live on commits.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)

          # WAIT for a verdict rather than demanding one already exists. A tag
          # reaches GitHub within seconds of being pushed, but the forge is still
          # running that commit's device tests -- minutes, behind a capacity-1
          # runner and the device lock. Asking once loses that race whenever a tag
          # closely follows a merge, which is the normal way to cut a release, and
          # it did: dapr v0.1.2's gate failed 5s in, then the status landed ~90s
          # later and the identical commit passed.
          #
          # Fail-closed is unchanged (FR-10.10): no verdict inside the window is
          # still a failure. Only "not yet" waits; a real FAILURE exits
          # immediately, because a failed hardware run will not become a passing
          # one by waiting.
          for attempt in $(seq 1 20); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "forge/device-tests")][0].state // "missing"')
            case "$state" in
              success)
                echo "forge/device-tests on $sha: success"
                exit 0
                ;;
              failure|error)
                echo "::error::the released commit FAILED its hardware run ($state). Fix it and tag" \
                  "again, or -- lab outage only -- re-run via workflow_dispatch with" \
                  "override_hardware_gate=true and a reason." >&2
                exit 1
                ;;
              *)
                echo "attempt $attempt/20: forge/device-tests on $sha is '$state'; waiting 30s"
                ;;
            esac
            sleep 30
          done
          echo "::error::no forge/device-tests verdict for $sha after 10 minutes. The forge posts it" \
            "for every main push; check the run there, or -- lab outage only -- re-run via" \
            "workflow_dispatch with override_hardware_gate=true and a reason." >&2
          exit 1

  # Gate the release on the full CI matrix: no jars are built or published unless
  # the unit + integration suites pass on every OS. These reuse the same
  # workflows CI runs (windows/mac/linux matrix, native SMB provisioning, etc.).
  test:
    if: ${{ !inputs.installers_only }}
    uses: ./.github/workflows/test.yml

  integration:
    if: ${{ !inputs.installers_only }}
    uses: ./.github/workflows/integration.yml

  build:
    needs: [hardware-gate, test, integration]
    # `!cancelled()` so this still runs when the three above are *skipped* by a
    # smoke build, and the failure check so a real release cannot slip past a
    # gate that actually ran and said no.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      # Not github.ref_name for a smoke build: that can be dispatched from a
      # branch, and a name like `split/08-package` would become the jar's version
      # and put a slash in its filename.
      DAPR_VERSION: ${{ inputs.installers_only && '0.0.0-smoke' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      # No virtual framebuffer any more: AOT used to boot the JavaFX toolkit,
      # which needed an X display on Linux. Compiling a web server does not.
      - name: Build uberjar
        run: clojure -T:build uber

      - name: Attach jar to release
        if: ${{ !inputs.installers_only }}
        uses: softprops/action-gh-release@v2
        with:
          files: target/dapr-*.jar

      # Handed to the package matrix rather than rebuilt there: the jar is the
      # same bytes on every OS, and rebuilding it three more times would be three
      # more chances for the installers to disagree with the published jar.
      - name: Upload jar for the installers
        uses: actions/upload-artifact@v4
        with:
          name: dapr-jar
          path: target/dapr-*.jar
          retention-days: 1

  # Desktop installers: the Electron shell (electron/) wrapped around that jar,
  # with a jlink runtime staged in beside it. One leg per OS, because this is the
  # step where the artifact genuinely is platform-specific.
  package:
    needs: [build]
    strategy:
      # One OS failing should not deny the others their installers -- a release
      # with two of three is worth more than a release with none, and the jar is
      # already attached by then regardless.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: |
              electron/dist/*.AppImage
              electron/dist/*.deb
          - os: windows-latest
            artifacts: |
              electron/dist/*.exe
          # macos-latest is Apple silicon, so this dmg is arm64. An Intel build
          # would need its own leg on macos-13: the staged JRE is native code, so
          # one runner cannot produce both.
          - os: macos-latest
            artifacts: |
              electron/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # For jlink, not for compiling: the runtime staged into the installer is
      # linked from this JDK, which is why each leg needs one of its own platform.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Packaging is a build.clj task (`package-electron`), so this leg needs the
      # Clojure CLI as well as Node: build.clj stages the jar and the linked JRE
      # -- reading both from the build that produced them rather than guessing --
      # and then runs electron-builder over the result.
      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: dapr-jar
          path: target

      # Kept as its own step rather than folded into the build task, so
      # setup-node's cache actually covers it.
      - name: Install shell dependencies
        working-directory: electron
        run: npm ci

      # DAPR_VERSION is the one place the version comes from: build.clj strips
      # the leading "v", names the jar it looks for with it, and stamps it on the
      # shell's package.json. package.json carries 0.0.0 in git, so nothing has
      # to be bumped to cut a release.
      - name: Build installers
        env:
          DAPR_VERSION: ${{ inputs.installers_only && '0.0.0-smoke' || github.ref_name }}
        run: clojure -T:build package-electron

      - name: Attach installers to release
        if: ${{ !inputs.installers_only }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}

      # The smoke build's whole point: something downloadable to open on the OS
      # that produced it.
      - name: Upload installers as run artifacts
        if: ${{ inputs.installers_only }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          retention-days: 7
