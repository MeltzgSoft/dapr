name: Release

# On a v#.#.# tag, run the unit + integration suites (the same reusable
# workflows, and hence the same windows/mac/linux matrix, as CI) and — only if
# both pass — build an AOT uberjar per OS (each carrying its own JavaFX natives,
# see build.clj) and attach them all to a single GitHub release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # Gate the release on the full CI matrix: no jars are built or published unless
  # the unit + integration suites pass on every OS. These reuse the same
  # workflows CI runs (windows/mac/linux matrix, native SMB provisioning, etc.).
  test:
    uses: ./.github/workflows/test.yml

  integration:
    uses: ./.github/workflows/integration.yml

  build:
    needs: [test, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
          - os: macos-latest
            classifier: mac-aarch64
          - os: windows-latest
            classifier: win
    runs-on: ${{ matrix.os }}
    env:
      DAPR_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      # AOT loads JavaFX classes whose static initializers boot the toolkit; on
      # headless Linux (GTK) that needs an X display, so run under a virtual
      # framebuffer. macOS/Windows initialize the toolkit headlessly.
      - name: Build uberjar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a clojure -T:build uber :javafx-classifier ${{ matrix.classifier }}

      - name: Build uberjar
        if: runner.os != 'Linux'
        run: clojure -T:build uber :javafx-classifier ${{ matrix.classifier }}

      - name: Attach jar to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/dapr-*.jar
