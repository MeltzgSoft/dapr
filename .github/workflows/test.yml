name: Test

# Everyday CI runs on the forge now (usb-ci FR-10.2, .forgejo/workflows/); this
# file stays on GitHub purely as release.yml's gate. The pull_request and push
# triggers are gone deliberately (FR-2.7): mirror pushes fire GitHub workflows,
# so leaving them would re-run this whole 3-OS matrix on every sync.
on:
  # Callable from release.yml so the release still validates on the
  # windows/mac/linux matrix the lab cannot provide (FR-10.17: macos-latest and
  # windows-latest do not exist self-hosted, and macOS has no substitute).
  # Reusable-workflow expansion is public-repos-only (FR-10.16) -- this repo is
  # public, and both caller and callee live here, so no cross-instance
  # reference disables it.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ matrix.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ matrix.os }}-

      - name: Run tests
        run: clojure -M:test
