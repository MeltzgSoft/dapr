name: Test

on:
  pull_request:
  push:
    branches: [main]
  # Callable as a gate from other workflows (e.g. release.yml) so the release
  # validates on the same matrix as CI.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ matrix.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ matrix.os }}-

      - name: Run tests
        run: clojure -M:test
